name: ci

# Every branch that AGENTS.md allows an agent to develop on gets the full
# remote test pipeline.  master is deliberately absent from `push`: once a
# change lands there the only remaining job is the Docker build in
# release.yml, so re-running the suite on the merge commit is wasted time.
# Pull requests still test before they reach master.
on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "test/**"
      - "perf/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  # The E2E jobs pull their test image from GHCR; the publishing job asks for
  # `packages: write` for itself below.
  packages: read

# A force-push or a quick follow-up commit makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Fast signal: types and unit tests do not need a bundle first.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # `yarn test` is transpile-only (see jest.config.js), so this is the
      # run's only type gate.  Its `include` covers the test files too.
      - name: Type check
        run: yarn tsc --noEmit
      # VISUAL_SYSTEM.md §11.3/§14.1: generated tokens cannot drift and no
      # text pair may fall below the contrast contract.
      - name: Check Imperial Elegy design tokens
        run: yarn ie:tokens:check
      - name: Check Imperial Elegy contrast
        run: yarn ie:contrast
      # The 3D table's map textures are derived from the published scan; the
      # check re-hashes them, so a regenerated scan cannot ship a stale table.
      - name: Check Imperial Elegy table textures
        run: yarn ie:table:check
      - name: Run unit tests
        run: yarn test --ci

  # The seeded self-play suites under tools/ are outside `yarn test`'s paths
  # (see jest.config.js), so the fixed-seed full game needs its own explicit
  # remote gate.  It plays one continuous campaign turn 1 -> Great War turn 5
  # with all six seats human-controlled and asserts no refused move.
  ie-sim-full-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run the fixed-seed full game
        run: >-
          yarn test --ci --runInBand
          --testPathPatterns "tools/ie-sim/fullGame"
          --testPathIgnorePatterns "/node_modules/"

  # The rule-invariant census for Imperial Elegy.  It plays real seeded games
  # through the real reducer and fails on any structural (A-group) break that is
  # not recorded in docs/imperial-elegy/invariants.baseline.json — and on a
  # baseline entry that no longer reproduces, so the list only ever shrinks.
  # The per-constraint positive/negative cases live in src/ and already run in
  # the "test" job; this job is the seeded census.  See
  # docs/imperial-elegy/INVARIANTS.md.
  ie-sim-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run the invariant census
        run: >-
          yarn test --ci --runInBand
          --testPathPatterns "tools/ie-sim/invariants"
          --testPathIgnorePatterns "/node_modules/"

  # Rule-invariant and property-based self-play for Virgin Queen.  Both suites
  # live under tools/ and are outside `yarn test`, so they need their own gate.
  # The mutation suite proves each invariant actually fires on a broken board;
  # the property suite plays seeded matches and checks the whole rule catalogue
  # (docs/vq-invariant-property-tests.md) after every action.
  vq-sim-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # The root tsconfig only includes ./src/*; the harness has its own one.
      - name: Type check the harness
        run: yarn tsc -p tools/vq-sim/tsconfig.json --noEmit
      - name: Run the invariant mutation and pending-window suites
        run: >-
          yarn test --ci --runInBand
          --testPathPatterns "tools/vq-sim/(invariantMutation|pendingWindow)"
          --testPathIgnorePatterns "/node_modules/"
      - name: Run the property-based simulation
        env:
          # One seed, all four scenario/player-count configurations, ~1500
          # actions at ~3-5 ms per action.  A second seed roughly doubles the
          # run; longer soaks are local (`VQ_PROPERTY_SEEDS`).
          VQ_PROPERTY_SEEDS: VQ-PROP-1
          # A failing seed is reproducible from its recorded step; shrinking
          # replays the match once per candidate reduction, so it stays a local
          # triage step instead of extending a red CI run.
          VQ_PROPERTY_SHRINK: "off"
        run: >-
          yarn test --ci --runInBand
          --testPathPatterns "tools/vq-sim/property"
          --testPathIgnorePatterns "/node_modules/"

  # The original sweep (refused moves, deadlocks, completion) over one seed and
  # all six scenario/player-count configurations.  A second seed doubles an
  # already ~4-minute run, so the matrix stays at one seed per push.
  vq-sim-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run the seeded self-play sweep
        env:
          VQ_SEEDS: VQ-SIM-3
        run: >-
          yarn test --ci --runInBand
          --testPathPatterns "tools/vq-sim/sweep"
          --testPathIgnorePatterns "/node_modules/"

  # Production build plus the server bundle.  `e2e-app` runs against the dev
  # server on its own origin, so nothing downstream consumes these artifacts.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build the frontend
        run: yarn build
      - name: Build the server bundle
        run: yarn build:server
      # The Nodaroo deployment uploads `yarn build:single`'s output and starts it
      # with plain node on a panel that has no node_modules and no PORT variable,
      # so the bundle has to carry its dependencies and its port. Copy the build
      # into an empty directory and boot it there with no PORT set: anything left
      # as an external `require`, or a lost `__PANEL_PORT__`, fails here.
      - name: Boot the single-file bundle with no node_modules and no PORT
        run: |
          yarn build:single
          mkdir -p "$RUNNER_TEMP/app/build"
          cp build/server.js build/index.html "$RUNNER_TEMP/app/build/"
          cp -r build/assets "$RUNNER_TEMP/app/build/"
          cd "$RUNNER_TEMP/app"
          DB_DIR="$RUNNER_TEMP/data" node build/server.js > bundle.log 2>&1 &
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:25664/ || true)" = "200" ]; then
              break
            fi
            sleep 2
          done
          page=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:25664/ || true)
          stats=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:25664/api/match-stats || true)
          pkill -f 'node build/server.js' || true
          echo "bundle: $(du -h build/server.js | cut -f1), GET / -> $page, GET /api/match-stats -> $stats on :25664"
          echo "node_modules present: $(test -d node_modules && echo yes || echo no)"
          tail -10 bundle.log
          test "$page" = "200" && test "$stats" = "200" && test ! -d node_modules

  # The browser environment, built once per dependency set.  The image holds
  # everything that used to be reinstalled on every push (Chromium headless
  # shell, its OS libraries, Node 22 and a warm Yarn cache); the E2E jobs mount
  # their checkout into it and only link node_modules from that cache.
  #
  # The tag is the content hash of Dockerfile.playwright (and its .dockerignore),
  # package.json and yarn.lock, so a source-only push reuses the published image
  # and a dependency change builds a new one.  Publishing needs `packages: write`,
  # which GitHub never grants to pull requests from forks, so fork PRs cannot
  # run the image-backed jobs without a maintainer first running them here.
  playwright-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
      tag: ${{ steps.reference.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Compute the image reference
        id: reference
        run: |
          version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::@playwright/test must be pinned to an exact version for the test image, got '$version'"
            exit 1
          fi
          tag="pw-$(cat Dockerfile.playwright Dockerfile.playwright.dockerignore package.json yarn.lock | sha256sum | cut -d' ' -f1 | cut -c1-16)"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/film-centenary-playwright"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Test image: $image:$tag (Playwright $version)"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look for an image built from this dependency set
        id: existing
        run: |
          if docker manifest inspect "${{ steps.reference.outputs.image }}:${{ steps.reference.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already published; skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image not published yet; building it."
          fi
      - name: Build and push the test image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.playwright
          platforms: linux/amd64
          push: true
          tags: ${{ steps.reference.outputs.image }}:${{ steps.reference.outputs.tag }}
          build-args: |
            PLAYWRIGHT_VERSION=${{ steps.reference.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Node 22 and Playwright headless Chromium for the ci.yml browser jobs
          cache-from: type=gha,scope=playwright-image
          cache-to: type=gha,scope=playwright-image

  # The default browser suite runs against the Vite dev server, so unlike the
  # IE jobs it needs nothing from `build` and does not wait for it: it starts
  # as soon as the image is ready and overlaps the build and unit-test jobs.
  e2e-app:
    needs: playwright-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.playwright-image.outputs.image }}:${{ needs.playwright-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Docker's default 64 MB /dev/shm is where Chromium keeps its shared
      # memory; a full six-player match exhausts it and the browser dies with a
      # closed-target error that looks like a test bug.
      options: --shm-size=1gb
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      # The job container runs as root while the runner owns the workspace, so
      # git refuses to read the repository ("dubious ownership").  checkout
      # registers its safe.directory under a throwaway HOME, so repeat it here
      # for the steps that read HEAD; vite.config.mts stamps the drawer footer
      # with `git rev-parse` and silently drops the commit when git fails.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Offline: the packages were fetched when the image was built.  This is
      # the only dependency step a browser job needs now.
      - name: Link dependencies from the image cache
        run: yarn install --frozen-lockfile --offline --non-interactive
      - name: Run browser tests
        run: yarn test:e2e
      # Screenshots, traces and the HTML report are what a failure is
      # diagnosed from, so they are kept even when the run fails.
  # The 3D table is the one browser suite that needs WebGL.  It runs on its own
  # runner: software rasterising a table scene beside the VQ boards starved their
  # ten-second waits, so the two never share a machine.
  e2e-table3d:
    needs: playwright-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-image.outputs.image }}:${{ needs.playwright-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=1gb
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Link dependencies from the image cache
        run: yarn install --frozen-lockfile --offline --non-interactive
      - name: Run the 3D table suite
        run: yarn test:e2e:table3d
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-table3d
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-app
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
