name: release

# Image builds and pushes are a master-only concern.  Tests run for every
# agent branch in ci.yml; this workflow assumes they passed on master before
# the merge and never publishes from a feature branch (a manual dispatch on
# one is gated below as well).
on:
  push:
    branches:
      - master
  workflow_dispatch:

# GITHUB_TOKEN needs packages: write to push to GitHub Container Registry.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: larry801

jobs:
  docker_image:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Check builder dependency change
        uses: actions/cache@v6
        id: builder-dependency-check
        with:
          path: package.json
          key: ${{ runner.os }}-yarn-builder-${{ hashFiles('package.json', 'yarn.lock', 'Dockerfile.builder') }}
          lookup-only: true
      - name: Check base dependency change
        uses: actions/cache@v6
        id: base-dependency-check
        with:
          path: package.json
          key: ${{ runner.os }}-yarn-base-${{ hashFiles('package.json', 'yarn.lock', 'Dockerfile.base') }}
          lookup-only: true
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push builder image
        if: steps.builder-dependency-check.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:latest
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:${{ steps.vars.outputs.sha_short }}
      - name: Build and push base image
        if: steps.base-dependency-check.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-base:latest
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-base:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-base:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-base:${{ steps.vars.outputs.sha_short }}
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/film-centenary:latest
            ${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}
      # The runtime image installs production dependencies only, so a module
      # imported by the server bundle but listed in devDependencies makes an
      # image that builds fine but crashes on boot. Prove it boots first.
      - name: Smoke test app image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e PORT=3000 -e DB_DIR=/data "${{ env.IMAGE_NAMESPACE }}/film-centenary:latest"
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)" = "200" ]; then
              echo "server responded with 200"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::app image did not answer on :3000"
          docker logs smoke
          docker rm -f smoke
          exit 1
      - name: Push app image
        run: |
          docker push "${{ env.IMAGE_NAMESPACE }}/film-centenary:latest"
          docker push "${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}"
          docker tag "${{ env.IMAGE_NAMESPACE }}/film-centenary:latest" "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary:latest"
          docker tag "${{ env.IMAGE_NAMESPACE }}/film-centenary:latest" "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}"
          docker tag "${{ env.IMAGE_NAMESPACE }}/film-centenary:latest" "docker.io/${{ env.IMAGE_NAMESPACE }}/film-centenary:latest"
          docker tag "${{ env.IMAGE_NAMESPACE }}/film-centenary:latest" "docker.io/${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}"
          docker push "docker.io/${{ env.IMAGE_NAMESPACE }}/film-centenary:latest"
          docker push "docker.io/${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}"
