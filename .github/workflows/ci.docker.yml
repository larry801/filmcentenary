name: ci

on:
  push:
    branches:
      - master
  workflow_dispatch:

# GITHUB_TOKEN needs packages: write to push to GitHub Container Registry.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: larry801

jobs:
  docker_image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Check builder dependency change
        uses: actions/cache@v6
        id: builder-dependency-check
        with:
          path: package.json
          key: ${{ runner.os }}-yarn-builder-${{ hashFiles('package.json', 'yarn.lock', 'Dockerfile.builder') }}
          lookup-only: true
      - name: Check base dependency change
        uses: actions/cache@v6
        id: base-dependency-check
        with:
          path: package.json
          key: ${{ runner.os }}-yarn-base-${{ hashFiles('package.json', 'yarn.lock', 'Dockerfile.base') }}
          lookup-only: true
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push builder image
        if: steps.builder-dependency-check.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:latest
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-builder:${{ steps.vars.outputs.sha_short }}
      - name: Build and push base image
        if: steps.base-dependency-check.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-base:latest
            ${{ env.IMAGE_NAMESPACE }}/film-centenary-base:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-base:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary-base:${{ steps.vars.outputs.sha_short }}
      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/film-centenary:latest
            ${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-centenary:${{ steps.vars.outputs.sha_short }}
