version: "3.2"
services:
  # Builds the same image CI publishes; for deploying the published image see
  # deploy/docker-compose.yml, which is what the VPS host runs.
  web:
    image: "ghcr.io/larry801/film-centenary:latest"
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_DIR: "/data"
    volumes:
      - ./data:/data
    restart: "unless-stopped"
